# Part-A development cell — episodic on K5 (rp_bdqn)
#
# Part-A switchboard cell episodic|on|K5 of the 10-cell structured partial factorial
# (freeze item 12). Development role: backbone numbers are the shared class-1
# placeholders and are superseded by the backbone-tuning pass (freeze item 2).
# Class-3 rule: ONLY the varied factor's own parameters may differ from the
# canonical cell — this file is audited by audits/c13_audit.py.
# C-K axis, K=5, prior on.
run_id: cell_episodic_on_K5_deepsea_dev
role: development
part: A
method: rp_bdqn
env: deep_sea
master_seed: 0
use_rule: episodic
prior: 'on'
K: 5
arm: episodic|on|K5
backbone:
  lr: 0.0005
  batch_size: 32
  gamma: 0.99
ensemble_shared:
  mask_prob: 0.5
  head_loss_agg: grad_norm_1_over_k
factor_specific:
  prior_scale: 3.0
  eps_schedule: null
env_budget:
  deep_sea_size: 30
  episodes: 2000
seeds:
- 0
- 1
- 2
- 3
- 4
